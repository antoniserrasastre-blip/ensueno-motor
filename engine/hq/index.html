<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HQ · partidas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
/* el HQ: una tarjeta por partida, una sola acción por tarjeta (abrirla) */
:root {
  --tinta: #10142a; --tinta-2: #171c38; --tinta-3: #222852; --linea: rgba(233, 216, 166, 0.14);
  --arena: #ede0bb; --arena-2: #b9ae92; --arena-3: #8a826d; --tiro: #c2387f; --brea: #f2b134; --mar: #4fb3bf; --bien: #7bc8a4;
  --pixel: "Pixelify Sans", system-ui, sans-serif; --texto: "Atkinson Hyperlegible", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--tinta); color: var(--arena); font: 15px/1.5 var(--texto); }
:focus-visible { outline: 2px solid var(--brea); outline-offset: 2px; border-radius: 6px; }
main { max-width: 980px; margin: 0 auto; padding: 40px 24px 60px; }
h1 { font: 700 30px var(--pixel); color: var(--tiro); margin: 0 0 4px; }
.sub { color: var(--arena-3); margin: 0 0 28px; }
.rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.tarjeta { display: flex; flex-direction: column; gap: 8px; padding: 20px; border-radius: 16px; background: var(--tinta-2);
  border: 1px solid var(--linea); color: inherit; text-decoration: none; min-height: 170px; transition: border-color .15s, transform .15s; }
.tarjeta:hover { border-color: var(--brea); transform: translateY(-2px); }
.tarjeta .icono { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--tinta-3); color: var(--brea); }
.tarjeta h2 { font: 700 21px var(--pixel); margin: 4px 0 0; }
.tarjeta .mundo { color: var(--arena-2); font-size: 14px; }
.tarjeta .ultimo { color: var(--arena-3); font-size: 13.5px; margin-top: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { align-self: flex-start; font: 700 12px var(--pixel); letter-spacing: .04em; padding: 3px 10px; border-radius: 999px;
  background: var(--tinta-3); color: var(--arena-2); }
.chip.nueva { background: rgba(123, 200, 164, .15); color: var(--bien); }
.mas { border-style: dashed; justify-content: center; align-items: center; text-align: center; color: var(--arena-3); cursor: pointer; background: none; font: inherit; }
.mas:hover { color: var(--arena); }
.mas small { color: var(--arena-3); font-size: 12.5px; }
dialog { background: var(--tinta-2); color: var(--arena); border: 1px solid var(--linea); border-radius: 16px; padding: 22px; width: min(420px, 92vw); }
dialog::backdrop { background: rgba(5, 7, 20, .6); }
dialog h3 { font: 700 19px var(--pixel); margin: 0 0 14px; }
dialog label { display: block; font-size: 13px; color: var(--arena-2); margin: 10px 0 4px; }
dialog select, dialog input { width: 100%; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--linea); background: var(--tinta); color: var(--arena); font: inherit; }
dialog footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
button.b { border: 0; padding: 9px 16px; border-radius: 10px; background: var(--tinta-3); color: var(--arena); font: 700 14px var(--texto); cursor: pointer; }
button.b.si { background: var(--brea); color: var(--tinta); }
.tarjeta.obra { border-color: rgba(242, 177, 52, .45); }
.chip.obra { background: rgba(242, 177, 52, .15); color: var(--brea); }
.pensando { display: inline-flex; gap: 4px; align-items: center; color: var(--arena-3); font-size: 13.5px; }
.pensando i { width: 7px; height: 7px; border-radius: 50%; background: var(--arena-3); animation: punto 1.2s infinite; }
.pensando i:nth-child(2) { animation-delay: .2s; } .pensando i:nth-child(3) { animation-delay: .4s; }
@keyframes punto { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.lista { list-style: none; margin: 4px 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; font-size: 13px; color: var(--arena-2); }
.lista li.no { color: var(--arena-3); }
.acciones { display: flex; gap: 8px; margin-top: auto; }
a.b { text-decoration: none; display: inline-block; }
.error { color: #e77fb4; font-size: 13px; min-height: 1em; margin: 8px 0 0; }
.vacio { color: var(--arena-3); }
@media (max-width: 560px) { main { padding: 26px 16px 40px; } h1 { font-size: 25px; } .tarjeta { min-height: 0; } }
</style>
</head>
<body>
<main>
  <h1>Partidas</h1>
  <p class="sub">Elige una para seguir jugando.</p>
  <div class="rejilla" id="rejilla"><p class="vacio">Cargando…</p></div>
</main>
<dialog id="nueva">
  <h3>Partida nueva</h3>
  <label for="mundo">Mundo</label><select id="mundo"></select>
  <label for="nombre">Nombre (si quieres)</label><input id="nombre" maxlength="60" placeholder="Mi partida">
  <p class="error" id="error"></p>
  <footer><button class="b" data-cerrar>Cancelar</button><button class="b si" id="crear">Crear</button></footer>
</dialog>
<dialog id="mundo-nuevo">
  <h3>Mundo nuevo (inventado)</h3>
  <label for="m-nombre">Nombre</label><input id="m-nombre" maxlength="60" placeholder="Las islas de niebla">
  <label for="m-icono">Icono (si quieres: un emoji)</label><input id="m-icono" maxlength="4" placeholder="🌫">
  <p class="error" id="m-error"></p>
  <footer><button class="b" data-cerrar>Cancelar</button><button class="b si" id="crear-mundo">Crear</button></footer>
</dialog>
<script>
// todo va relativo a esta página: el HQ sirve en «/» y bajo un prefijo (como /partida/ detrás de un proxy)
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const ICONO = { externo: "ship", nuevo: "castle" };
const ESPERA = `<span class="pensando" role="status"><i></i><i></i><i></i> Esperando al director…</span>`;
// un mundo inventado aún sin terminar: lo que falta (✅/⬜) y si el director está con ello
function tarjetaObra(p) {
  const ap = p.construccion, req = ap.filter(a => !a.opcional), hechos = req.filter(a => a.ok).length;
  return `<div class="tarjeta obra"><span class="icono">${p.icono ? `<span style="font-size:22px">${esc(p.icono)}</span>` : `<i data-lucide="hammer"></i>`}</span>
    <h2>${esc(p.nombre)}</h2><span class="chip obra">En construcción · ${hechos}/${req.length}</span>
    ${p.esperando ? ESPERA : `<span class="mundo">Le dictas el lore al director en la mesa de la partida.</span>`}
    <ul class="lista">${ap.map(a => `<li class="${a.ok ? "" : "no"}" title="${esc(a.falta || "hecho")}">${a.ok ? "✅" : "⬜"} ${esc(a.nombre)}</li>`).join("")}</ul>
    <div class="acciones"><a class="b" href="${esc(p.url)}">Abrir</a></div></div>`;
}
// una partida lista y sin empezar: «Empezar» la arranca sola (el director lo oye y hace la sesión cero)
function tarjetaLista(p) {
  return `<div class="tarjeta"><span class="icono">${p.icono ? `<span style="font-size:22px">${esc(p.icono)}</span>` : `<i data-lucide="${ICONO[p.motor] || "map"}"></i>`}</span>
    <h2>${esc(p.nombre)}</h2><span class="mundo">${esc(p.subtitulo || p.mundo || "")}</span>
    ${p.esperando ? ESPERA : `<span class="chip nueva">Lista para empezar</span>`}
    <div class="acciones">${p.empezada ? "" : `<button class="b si" data-empezar="${esc(p.id)}" data-url="${esc(p.url)}">Empezar</button>`}<a class="b" href="${esc(p.url)}">Abrir</a></div></div>`;
}
function tarjeta(p) {
  if (p.construccion) return tarjetaObra(p);
  if (p.motor === "nuevo" && p.turno === 0) return tarjetaLista(p);
  const empezada = p.turno > 0;
  const chip = p.turno == null ? "" : empezada ? `<span class="chip">Turno ${p.turno}${p.cuando ? " · " + esc(p.cuando) : ""}</span>` : `<span class="chip nueva">Lista para empezar</span>`;
  return `<a class="tarjeta" href="${esc(p.url)}"><span class="icono">${p.icono ? `<span style="font-size:22px">${esc(p.icono)}</span>` : `<i data-lucide="${ICONO[p.motor] || "map"}"></i>`}</span>
    <h2>${esc(p.nombre)}</h2><span class="mundo">${esc(p.subtitulo || p.mundo || "")}</span>${chip}
    ${p.forja || p.forja_on ? `<span class="ultimo" title="La forja: lo que se construye para esta partida">🔨 ${p.forja_on ? `${p.forja_on} en marcha` : ""}${p.forja && p.forja_on ? " · " : ""}${p.forja ? `${p.forja} en la forja` : ""}</span>` : ""}
    ${p.ultimo ? `<span class="ultimo">${esc(p.ultimo)}</span>` : p.turno === 0 ? `<span class="ultimo">Sesión cero: eliges quién eres.</span>` : ""}</a>`;
}
async function cargar() {
  try {
    const ps = await (await fetch("api/partidas")).json();
    // la que se jugó la última, primero
    ps.sort((a, b) => (b.cambiado || 0) - (a.cambiado || 0));
    $("rejilla").innerHTML = ps.map(tarjeta).join("") + `<button class="tarjeta mas" id="abrir-nueva"><span class="icono"><i data-lucide="plus"></i></span>Partida nueva<small>con un mundo que ya existe</small></button>`
      + `<button class="tarjeta mas" id="abrir-mundo"><span class="icono"><i data-lucide="sparkles"></i></span>Mundo nuevo<small>inventado: tú dictas el lore</small></button>`;
  } catch (e) {
    $("rejilla").innerHTML = `<p class="vacio">No se pueden leer las partidas: ¿está el servidor en marcha?</p>`;
  }
  window.lucide?.createIcons();
}
document.addEventListener("click", async ev => {
  if (ev.target.closest("#abrir-nueva")) {
    const ms = await (await fetch("api/mundos")).json();
    $("mundo").innerHTML = ms.map(m => `<option value="${esc(m.id)}">${esc(m.nombre)}${m.subtitulo ? " · " + esc(m.subtitulo) : ""}</option>`).join("");
    $("error").textContent = "";
    $("nueva").showModal();
  }
  if (ev.target.closest("[data-cerrar]")) ev.target.closest("dialog").close();
  if (ev.target.closest("#abrir-mundo")) { $("m-error").textContent = ""; $("mundo-nuevo").showModal(); }
  const em = ev.target.closest("[data-empezar]");
  if (em) {
    em.disabled = true;
    const r = await fetch(`api/p/${em.dataset.empezar}/mesa`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ evento: "empezar" }) });
    if (r.ok) location.href = em.dataset.url; else { em.disabled = false; cargar(); }
  }
  if (ev.target.closest("#crear-mundo")) {
    const r = await fetch("api/mundo", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nombre: $("m-nombre").value.trim(), icono: $("m-icono").value.trim() }) });
    const d = await r.json();
    if (!r.ok) { $("m-error").textContent = d.error || "No se pudo crear"; return; }
    $("mundo-nuevo").close();
    location.href = `p/${d.id}/`;                      // a su mesa: el director ya lo ha oído y empieza a preguntar
  }
  if (ev.target.closest("#crear")) {
    const r = await fetch("api/nueva", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mundo: $("mundo").value, nombre: $("nombre").value.trim() || undefined }) });
    const d = await r.json();
    if (!r.ok) { $("error").textContent = d.error || "No se pudo crear"; return; }
    location.href = `p/${d.id}/`;
  }
});
cargar();
setInterval(() => { if (!document.querySelector("dialog[open]")) cargar(); }, 5000);
</script>
</body>
</html>
